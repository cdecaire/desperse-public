name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools 'Bash(pnpm:*),Bash(npx:*),Bash(gh pr:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*)'
            --append-system-prompt 'Whenever you are asked to review a pull request in this repo, for ANY reason and no matter how the request is phrased (even if it just says "review" or "confirm X", with no explicit mention of merging or approving), always act on your own verdict instead of just describing it in prose - do not wait for the trigger comment to explicitly say "merge" or "approve" before doing so, and do not treat a narrowly-worded request as license to skip this. Run pnpm install, npx tsc --noEmit, pnpm test, and pnpm build yourself to verify - do not rely on manual tracing when these tools are available to you. If the PR is correct and verification passes, you MUST run gh pr review --approve and then gh pr merge --squash --auto as the final step of your review, and note in your final comment that the Hermes agent should mark the linked kanban card done. If changes are needed, run gh pr review --request-changes with a clear itemized list of fixes, and do not merge. If the approve or merge command fails with a permissions error, state the exact error - do not fall back to saying a maintainer should merge it, and do not silently stop after posting review prose without having actually called gh pr review/merge. This repo requires all review conversations resolved before merging, so keep minor non-blocking notes in the top-level review body rather than inline comments; only use inline comments for issues serious enough to justify request-changes.'
