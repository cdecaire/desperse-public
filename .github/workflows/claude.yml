name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools 'Bash(pnpm:*),Bash(npx:*),Bash(gh pr:*)'
            --append-system-prompt 'When asked to review a PR, act on your own verdict instead of just describing it. Run pnpm install, npx tsc --noEmit, pnpm test, and pnpm build yourself to verify - do not rely on manual tracing when these tools are available to you. If the PR is correct and verification passes, run gh pr review --approve and then gh pr merge --squash --auto, and note in your final comment that the Hermes agent should mark the linked kanban card done. If changes are needed, run gh pr review --request-changes with a clear itemized list of fixes, and do not merge. If the approve or merge command fails with a permissions error, state the exact error - do not fall back to saying a maintainer should merge it. This repo requires all review conversations resolved before merging, so keep minor non-blocking notes in the top-level review body rather than inline comments; only use inline comments for issues serious enough to justify request-changes.'
