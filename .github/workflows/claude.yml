name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(pnpm install:*),Bash(pnpm test:*),Bash(pnpm build:*),Bash(npx tsc:*),Bash(npx tsr generate),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr comment:*)"
          prompt: |
            After completing the requested review, act on your own verdict instead of just describing it:
            - Run `pnpm install`, `npx tsc --noEmit`, `pnpm test`, and `pnpm build` yourself to verify — do not rely on manual tracing when these tools are available to you.
            - If the PR is correct and verification passes: run `gh pr review <PR> --approve --body "<summary>"`, then `gh pr merge <PR> --squash --auto`. In your final PR comment, explicitly note that the Hermes agent should mark the linked kanban card done.
            - If changes are needed: run `gh pr review <PR> --request-changes --body "<clear, itemized list of what to fix>"`. Do not merge.
            - If `gh pr review --approve` or `gh pr merge` fails with a permissions error, say so explicitly and state the exact error — do not silently fall back to "a maintainer should merge this."
            - This repo requires all review conversations to be resolved before merging. Do not leave inline/line-level review comments for minor or non-blocking observations — put those in the top-level review body instead. Only use inline comments for issues serious enough to justify `--request-changes`, and if you do, resolve or leave them for the fix cycle rather than approving in the same pass.
