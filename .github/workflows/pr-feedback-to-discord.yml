name: PR feedback → Discord (Hermes trigger)

# When a human leaves review feedback on one of the agent's OWN PRs, ping the
# Hermes Discord bot in #github so it can triage it.
# Both legs are outbound (Action -> Discord; the Hermes box long-polls Discord),
# so no public endpoint or tunnel is needed.
#
# The instruction the bot receives depends on PR state:
#   - merged/closed PR  -> bookkeeping only: mark the linked kanban card done. No code.
#   - open PR           -> triage per the kanban-pr-lifecycle #github channel rule
#                          (formal reviews are auto-requeued by the PR Feedback Requeue
#                          cron; comment feedback gets requeued as a card; never code inline).

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    # Fire on HUMAN feedback, and only on the bot's own PRs:
    #   - exclude the bot's own activity (desperse-agent);
    #   - exclude every other bot sender (vercel[bot], github-actions[bot], …) —
    #     Vercel posts a deploy comment seconds after each push, which would
    #     otherwise trigger the agent with no real review feedback (and could loop);
    #   - issue_comment also fires on plain issues -> gate to PRs.
    # The pull_request/closed leg is a separate case: it fires on ANY merge of the
    # bot's own PR regardless of who/what merged it (human or Claude's own approve+
    # merge), since a merge always needs the bookkeeping ping — no bot-sender filter.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'desperse-agent' && github.event.pull_request.merged == true)
      ||
      (
        github.event.sender.login != 'desperse-agent' &&
        !endsWith(github.event.sender.login, '[bot]') &&
        (
          (github.event_name == 'issue_comment'
            && github.event.issue.pull_request != null
            && github.event.issue.user.login == 'desperse-agent')
          ||
          ((github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment')
            && github.event.pull_request.user.login == 'desperse-agent')
        )
      )
    steps:
      - name: Post feedback to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_ID: "1511935966108061766"
          PR_NUM:   ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_TITLE: ${{ github.event.pull_request.title  || github.event.issue.title }}
          PR_URL:   ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          PR_STATE: ${{ github.event.pull_request.state || github.event.issue.state }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
          REVIEWER: ${{ github.event.review.user.login || github.event.comment.user.login || github.event.sender.login }}
          FEEDBACK: ${{ github.event.review.body || github.event.comment.body }}
        run: |
          FEEDBACK_TRIMMED="${FEEDBACK:0:1200}"   # keep under Discord's 2000-char limit

          # issue_comment on a merged PR reports state=closed (merged flag absent),
          # so treat closed and merged identically: bookkeeping only.
          if [ "$PR_MERGED" = "true" ] || [ "$PR_STATE" = "closed" ]; then
            INSTRUCTION="This PR is merged/closed. BOOKKEEPING ONLY: do NOT run any workflow, do NOT touch any working tree, do NOT push anything. If a kanban card is linked to this PR and not yet done, mark it complete (hermes kanban complete) and reply with the card id. Otherwise reply noop."
          else
            INSTRUCTION="Triage per the kanban-pr-lifecycle #github channel rule. Formal CHANGES_REQUESTED reviews are auto-requeued as Kanban cards by the PR Feedback Requeue cron — do NOT duplicate, just acknowledge. Comment-type feedback: requeue it as a fresh Kanban card (PR URL in the card BODY, assignee coding). Pure metadata asks (retarget base, labels): one gh api PATCH call max. NEVER edit code, clone, rebase, or push from this channel."
          fi

          MSG="<@${BOT_ID}> PR #${PR_NUM} \"${PR_TITLE}\" has new review feedback from ${REVIEWER} (state: ${PR_STATE}, merged: ${PR_MERGED}):

          ${FEEDBACK_TRIMMED}

          ${PR_URL}

          ${INSTRUCTION}"
          jq -n --arg content "$MSG" --arg uid "$BOT_ID" \
            '{username:"GitHub", content:$content, allowed_mentions:{users:[$uid]}}' \
          | curl -sS -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" --data-binary @-
