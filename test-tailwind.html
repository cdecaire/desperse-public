<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --motion-duration-slow: 300ms;
  }
  .test {
    transition-duration: var(--motion-duration-slow);
  }
  .test-calc {
    transition-duration: calc(300ms * var(--motion-scale, 1));
  }
</style>
</head>
<body>
<div class="test">Test 1</div>
<div class="test-calc">Test 2</div>
</body>
</html>
